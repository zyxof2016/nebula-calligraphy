apiVersion: v1
kind: Service
metadata:
  name: {{ include "nebula-calligraphy.name" . }}
  labels:
    {{- include "nebula-calligraphy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "nebula-calligraphy.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
