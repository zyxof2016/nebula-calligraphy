{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nebula-calligraphy.name" . }}
  labels:
    {{- include "nebula-calligraphy.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "nebula-calligraphy.selectorLabels" . | nindent 6 }}
{{- end }}
