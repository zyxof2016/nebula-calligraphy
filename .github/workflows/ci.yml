name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/calligraphy/go.mod
          cache-dependency-path: services/calligraphy/go.sum

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .flutter-version
          cache: true

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install deterministic CJK test font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei

      - name: Validate contracts and scripts
        run: make -f Makefile.split split-check

      - name: Scan Go vulnerabilities
        working-directory: services/calligraphy
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Analyze and test Flutter
        working-directory: apps/mobile
        run: |
          flutter analyze
          flutter test

      - name: Build Flutter Web
        working-directory: apps/mobile
        run: flutter build web --release

      - name: Build Android debug package
        working-directory: apps/mobile
        run: >-
          flutter build apk --debug
          --dart-define=CALLIGRAPHY_API_BASE_URL=https://calligraphy.invalid
          --dart-define=CALLIGRAPHY_OIDC_CLIENT_ID=nebula-calligraphy-mobile
          --dart-define=CALLIGRAPHY_OIDC_REDIRECT_URI=com.nebula.calligraphy:/oauthredirect

      - name: Build container
        run: docker build -f deploy/docker/Dockerfile -t nebula-calligraphy:ci .

  ios-verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .flutter-version
          cache: true

      - name: Build iOS release without signing
        working-directory: apps/mobile
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=CALLIGRAPHY_API_BASE_URL=https://calligraphy.invalid
          --dart-define=CALLIGRAPHY_OIDC_CLIENT_ID=nebula-calligraphy-mobile
          --dart-define=CALLIGRAPHY_OIDC_REDIRECT_URI=com.nebula.calligraphy:/oauthredirect
