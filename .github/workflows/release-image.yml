name: 发布生产镜像

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 镜像版本，例如 1.0.0
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: 计算版本
        id: version
        shell: bash
        run: |
          value="${{ inputs.version || github.ref_name }}"
          echo "value=${value#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nebula-calligraphy:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/nebula-calligraphy:sha-${{ github.sha }}
          cache-from: type=gha,scope=nebula-calligraphy
          cache-to: type=gha,mode=max,scope=nebula-calligraphy
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/nebula-calligraphy@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: 签名不可变镜像
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/nebula-calligraphy@${{ steps.build.outputs.digest }}
