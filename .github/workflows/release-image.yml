name: 发布生产镜像

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 镜像版本，例如 1.0.0
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: 计算版本
        id: version
        shell: bash
        run: |
          value="${{ inputs.version || github.ref_name }}"
          echo "value=${value#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nebula-calligraphy:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/nebula-calligraphy:sha-${{ github.sha }}
          cache-from: type=gha,scope=nebula-calligraphy
          cache-to: type=gha,mode=max,scope=nebula-calligraphy
      - uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/nebula-calligraphy@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: 签名不可变镜像
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/nebula-calligraphy@${{ steps.build.outputs.digest }}
